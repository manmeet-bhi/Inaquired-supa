<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <title>inaquired – Find Remote, On-Site & Hybrid Jobs & Internships</title>
    <meta name="description" content="Discover verified career opportunities on inaquired. Explore remote, hybrid, on-site roles, and internships with real-time updates and seamless search." />
    <meta property="og:title" content="inaquired – Find Remote, On-Site & Hybrid Jobs & Internships" />
    <meta property="og:description" content="Discover verified career opportunities on inaquired. Explore remote, hybrid, on-site roles, and internships with real-time updates and seamless search." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="inaquired" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="inaquired – Find Remote, On-Site & Hybrid Jobs & Internships" />
    <meta name="twitter:description" content="Discover verified career opportunities on inaquired. Explore remote, hybrid, on-site roles, and internships with real-time updates and seamless search." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "inaquired",
      "url": "https://inaquired.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://inaquired.app/jobs?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('inaquired_theme') || localStorage.getItem('theme');
          if (!saved) {
            var match = document.cookie.match(/inaquired_theme=([^;]+)/);
            if (match) saved = match[1];
          }
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Netlify Forms Pre-rendering Detection (Required for React / Vite SPA) -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>

    <form name="post-a-job" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="post-a-job" />
      <input type="text" name="bot-field" />
      <input type="text" name="employer_name" />
      <input type="email" name="employer_email" />
      <input type="text" name="company_name" />
      <input type="text" name="company_website" />
      <input type="text" name="title" />
      <input type="text" name="category" />
      <input type="text" name="work_arrangement" />
      <input type="text" name="job_type" />
      <input type="text" name="experience_level" />
      <input type="text" name="location" />
      <input type="text" name="salary_min" />
      <input type="text" name="salary_max" />
      <input type="text" name="currency" />
      <input type="text" name="application_url" />
      <input type="text" name="application_deadline" />
      <input type="text" name="tags" />
      <textarea name="description"></textarea>
      <textarea name="responsibilities"></textarea>
      <textarea name="requirements"></textarea>
      <textarea name="benefits"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
