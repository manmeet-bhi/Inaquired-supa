<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>inaquired – Find Remote, On-Site & Hybrid Jobs & Internships</title>
    <meta name="description" content="Discover verified career opportunities on inaquired. Explore remote, hybrid, on-site roles, and internships with real-time updates and seamless search." />
    <meta property="og:title" content="inaquired – Find Remote, On-Site & Hybrid Jobs & Internships" />
    <meta property="og:description" content="Discover verified career opportunities on inaquired. Explore remote, hybrid, on-site roles, and internships with real-time updates and seamless search." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="inaquired" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="inaquired – Find Remote, On-Site & Hybrid Jobs & Internships" />
    <meta name="twitter:description" content="Discover verified career opportunities on inaquired. Explore remote, hybrid, on-site roles, and internships with real-time updates and seamless search." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "inaquired",
      "url": "https://inaquired.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://inaquired.app/jobs?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('inaquired_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
